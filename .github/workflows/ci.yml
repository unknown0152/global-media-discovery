name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install browser build dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild pinned browser assets
        run: npm run build
      - name: Run all validation gates
        run: make test
      - name: Confirm generated assets are committed
        run: git diff --exit-code
