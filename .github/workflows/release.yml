name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify tag matches project version
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Install and build browser assets
        run: npm ci --ignore-scripts && npm run build
      - name: Build and validate release artifacts
        run: make release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Global Media Discovery ${version}")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            "../release/global-media-discovery-installer-${version}.run#Self-extracting VPS installer" \
            "../release/global-media-discovery-source-${version}.tar.gz#Source archive" \
            "../release/global-media-discovery-release-${version}.json#Release manifest" \
            "../release/global-media-discovery-SHA256SUMS-${version}.txt#SHA-256 checksums"
