name: global-media-discovery

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: global-media-discovery-web:${GMD_VERSION:-2.1.0}
    environment:
      GMD_DATA_DIR: /data
      GMD_DATABASE_PATH: /data/catalog.sqlite3
      GMD_SITE_NAME: ${GMD_SITE_NAME:-Global Media Discovery}
      GMD_SEERR_PUBLIC_URL: ${GMD_SEERR_PUBLIC_URL:-}
      GMD_MAX_QUERY_DAYS: ${GMD_MAX_QUERY_DAYS:-366}
      GMD_MAX_PAGE_SIZE: ${GMD_MAX_PAGE_SIZE:-200}
    volumes:
      - ./data:/data:ro
    expose:
      - "8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  collector:
    image: global-media-discovery-collector:${GMD_VERSION:-2.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - collector-daemon
    environment:
      GMD_DATA_DIR: /data
      GMD_DATABASE_PATH: /data/catalog.sqlite3
      GMD_SEED_DIR: /app/seed
      GMD_SITE_NAME: ${GMD_SITE_NAME:-Global Media Discovery}
      GMD_PUBLIC_URL: ${GMD_PUBLIC_URL:-}
      GMD_LOG_LEVEL: ${GMD_LOG_LEVEL:-INFO}
      GMD_LOG_FORMAT: ${GMD_LOG_FORMAT:-json}
      GMD_UPDATE_INTERVAL_HOURS: ${GMD_UPDATE_INTERVAL_HOURS:-24}
      GMD_PAST_DAYS: ${GMD_PAST_DAYS:-365}
      GMD_FUTURE_DAYS: ${GMD_FUTURE_DAYS:-540}
      GMD_TVDB_FULL_SCAN_DAYS: ${GMD_TVDB_FULL_SCAN_DAYS:-7}
      GMD_TVDB_EXTENDED_LIMIT: ${GMD_TVDB_EXTENDED_LIMIT:-600}
      GMD_TMDB_DETAIL_LIMIT: ${GMD_TMDB_DETAIL_LIMIT:-1200}
      GMD_TVMAZE_RECENT_DAYS: ${GMD_TVMAZE_RECENT_DAYS:-30}
      GMD_TVMAZE_BACKFILL_DAYS: ${GMD_TVMAZE_BACKFILL_DAYS:-365}
      GMD_TVMAZE_BACKFILL_INTERVAL_DAYS: ${GMD_TVMAZE_BACKFILL_INTERVAL_DAYS:-7}
      GMD_BACKUP_RETENTION: ${GMD_BACKUP_RETENTION:-14}
      GMD_REQUEST_TIMEOUT_SECONDS: ${GMD_REQUEST_TIMEOUT_SECONDS:-45}
      GMD_SOURCE_DELAY_MS: ${GMD_SOURCE_DELAY_MS:-220}
      GMD_COLLECTOR_RUN_ON_START: ${GMD_COLLECTOR_RUN_ON_START:-true}
      GMD_ENABLE_SIMKL: ${GMD_ENABLE_SIMKL:-false}
      GMD_SIMKL_PERMISSION_CONFIRMED: ${GMD_SIMKL_PERMISSION_CONFIRMED:-false}
      TMDB_TOKEN_FILE: /run/secrets/tmdb_token
      TVDB_KEY_FILE: /run/secrets/tvdb_key
      SIMKL_CLIENT_ID_FILE: /run/secrets/simkl_client_id
    volumes:
      - ./data:/data
    secrets:
      - tmdb_token
      - tvdb_key
      - simkl_client_id
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.5
    networks:
      - source_egress
    healthcheck:
      test: ["CMD", "python", "-m", "gmd", "collector-health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "4"

  caddy:
    image: caddy:2.10-alpine
    user: "1000:1000"
    environment:
      GMD_SITE_ADDRESS: ${GMD_SITE_ADDRESS:-http://:80}
    ports:
      - "${GMD_HTTP_PORT:-8080}:80"
      - "${GMD_HTTPS_BIND:-127.0.0.1}:${GMD_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.75
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true
  source_egress:

volumes:
  caddy_data:
  caddy_config:

secrets:
  tmdb_token:
    file: ./secrets/tmdb_token
  tvdb_key:
    file: ./secrets/tvdb_key
  simkl_client_id:
    file: ./secrets/simkl_client_id
