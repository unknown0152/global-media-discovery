[project]
name = "global-media-discovery"
version = "1.3.0"
description = "A date-first, read-only worldwide television premiere catalog"
requires-python = ">=3.13"
dependencies = ["gunicorn==23.0.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["data", "secrets"]
reportMissingTypeStubs = "none"
